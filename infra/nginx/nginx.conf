upstream acmeu_api {
    server api:4000;
    keepalive 32;
}

upstream acmeu_web {
    server web:80;
    keepalive 16;
}

proxy_cache_path /var/cache/nginx/acmeu levels=1:2 keys_zone=acmeu_cache:16m max_size=512m inactive=10m use_temp_path=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 64m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /healthz {
        proxy_pass http://acmeu_api/healthz;
        access_log off;
    }

    location /readyz {
        proxy_pass http://acmeu_api/readyz;
        access_log off;
    }

    location /api/ {
        proxy_pass http://acmeu_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /graphql {
        proxy_pass http://acmeu_api/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /.well-known/ {
        proxy_pass http://acmeu_api/.well-known/;
        proxy_set_header Host $host;
    }

    location /internal/ {
        proxy_pass http://acmeu_api/internal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        proxy_pass http://acmeu_web/assets/;
        proxy_cache acmeu_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 10m;
        expires 7d;
    }

    location /uploads/ {
        proxy_pass http://acmeu_api/uploads/;
        proxy_set_header Host $host;
        proxy_cache acmeu_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 5m;
    }

    location / {
        proxy_pass http://acmeu_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
