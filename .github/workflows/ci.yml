name: CI

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acmeu
          POSTGRES_PASSWORD: acmeu
          POSTGRES_DB: acmeu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acmeu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Migrate
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://acmeu:acmeu@localhost:5432/acmeu

      - name: Test
        run: npm test
        env:
          DATABASE_URL: postgres://acmeu:acmeu@localhost:5432/acmeu
          REDIS_URL: redis://localhost:6379

      - name: Publish coverage summary
        uses: acme-eng/coverage-comment-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: ${{ github.event.pull_request.title }}

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t acmeu/api:${{ github.sha }} .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t acmeu/web:${{ github.sha }} .
